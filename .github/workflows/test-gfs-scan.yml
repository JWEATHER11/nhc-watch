name: Test GFS Scan (one-off)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install tzdata --break-system-packages
          pip install xarray netCDF4 numpy --break-system-packages

      - name: Run GFS scan test
        run: python test_gfs_scan.py
