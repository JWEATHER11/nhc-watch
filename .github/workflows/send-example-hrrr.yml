name: Send Example HRRR (one-off)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eccodes (optional -- HREF backup check only)
        run: pip install --quiet eccodes || echo "eccodes install failed -- HREF backup will be skipped, core HRRR alert unaffected"
      - name: Send example
        env:
          WXMODEL_TELEGRAM_BOT_TOKEN: ${{ secrets.WXMODEL_TELEGRAM_BOT_TOKEN }}
          WXMODEL_TELEGRAM_CHAT_ID: ${{ secrets.WXMODEL_TELEGRAM_CHAT_ID }}
          WXMODEL_TELEGRAM_CHAT_ID_2: ${{ secrets.WXMODEL_TELEGRAM_CHAT_ID_2 }}
        run: python send_example_hrrr.py
