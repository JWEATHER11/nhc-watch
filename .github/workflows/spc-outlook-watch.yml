name: SPC Outlook Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SPC outlook pipeline
        env:
          SPC_TELEGRAM_BOT_TOKEN: ${{ secrets.SPC_TELEGRAM_BOT_TOKEN }}
          SPC_TELEGRAM_CHAT_ID: ${{ secrets.SPC_TELEGRAM_CHAT_ID }}
          SPC_TELEGRAM_CHAT_ID_2: ${{ secrets.SPC_TELEGRAM_CHAT_ID_2 }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python spc_outlook_pipeline.py

      - name: Commit updated state
        run: |
          git config user.name "spc-outlook-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add spc_outlook_state.json
          git diff --quiet --cached || git commit -m "Update SPC outlook state [skip ci]"
          git pull --rebase --autostash || true
          git push
