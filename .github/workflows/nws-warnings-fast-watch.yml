name: NWS Warnings Fast Watch (Continuous)

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: nws-warnings-fast-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run continuous NWS warnings polling loop
        env:
          NWS_TELEGRAM_BOT_TOKEN: ${{ secrets.NWS_TELEGRAM_BOT_TOKEN }}
          NWS_TELEGRAM_CHAT_ID: ${{ secrets.NWS_TELEGRAM_CHAT_ID }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u nws_warnings_fast_loop.py

      - name: Final state commit (safety net)
        if: always()
        run: |
          git config user.name "nws-warnings-fast-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nws_warnings_state.json
          git diff --quiet --cached || git commit -m "Update NWS warnings state [skip ci]"
          git push || true
