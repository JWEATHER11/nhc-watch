name: NWS AFD Fast Watch (Continuous)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: nws-afd-fast-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run continuous NWS AFD polling loop
        env:
          NWS_TELEGRAM_BOT_TOKEN: ${{ secrets.NWS_TELEGRAM_BOT_TOKEN }}
          NWS_TELEGRAM_CHAT_ID: ${{ secrets.NWS_TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python nws_afd_fast_loop.py

      - name: Final state commit (safety net)
        if: always()
        run: |
          git config user.name "nws-afd-fast-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nws_afd_state.json
          git diff --quiet --cached || git commit -m "Update NWS AFD state [skip ci]"
          git push || true
