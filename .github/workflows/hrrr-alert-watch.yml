name: HRRR Alert Watch (Continuous)

on:
  schedule:
    # Safety net only -- fires every 6h in case the self-restart chain ever
    # breaks. Under normal operation the loop keeps itself running
    # continuously and this trigger does nothing (see concurrency block).
    - cron: "20 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: hrrr-alert-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run continuous HRRR alert polling loop
        env:
          WXMODEL_TELEGRAM_BOT_TOKEN: ${{ secrets.WXMODEL_TELEGRAM_BOT_TOKEN }}
          WXMODEL_TELEGRAM_CHAT_ID: ${{ secrets.WXMODEL_TELEGRAM_CHAT_ID }}
          WXMODEL_TELEGRAM_CHAT_ID_2: ${{ secrets.WXMODEL_TELEGRAM_CHAT_ID_2 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u hrrr_alert_fast_loop.py

      - name: Final state commit (safety net)
        if: always()
        run: |
          git config user.name "hrrr-alert-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hrrr_alert_state.json
          git diff --quiet --cached || git commit -m "Update HRRR alert state [skip ci]"
          git push || true
