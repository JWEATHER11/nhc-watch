name: METAR Real Storm Watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run METAR storm pipeline
        env:
          NWS_TELEGRAM_BOT_TOKEN: ${{ secrets.NWS_TELEGRAM_BOT_TOKEN }}
          NWS_TELEGRAM_CHAT_ID: ${{ secrets.NWS_TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u metar_storm_pipeline.py

      - name: Commit updated state
        run: |
          git config user.name "metar-storm-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add metar_storm_state.json
          git diff --quiet --cached || git commit -m "Update METAR storm state [skip ci]"
          git pull --rebase --autostash || true
          git push
